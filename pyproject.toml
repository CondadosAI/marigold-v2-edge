[project]
name = "marigold-v2-edge"
version = "0.1.0"
description = "Running Marigold V2 monocular depth on a 6 GB laptop GPU: a rank-128 LoRA over a quantized Qwen-Image-Edit-2509 backbone."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "diffusers>=0.38.0",
    "transformers>=4.50",
    "accelerate>=1.0",
    "peft>=0.14",
    "safetensors>=0.5",
    "gguf>=0.13",
    "bitsandbytes>=0.45",
    "huggingface-hub>=0.30",
    "numpy>=1.26",
    "pillow>=10.0",
    "opencv-python-headless>=4.10",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "click>=8.1",
    "loguru>=0.7",
    "tabulate>=0.9",
    "tqdm>=4.66",
]

[project.scripts]
marigold-edge = "marigoldedge.cli:cli"

[dependency-groups]
dev = ["ruff>=0.6", "jupyterlab>=4.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marigoldedge"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]

[tool.ruff.lint.isort]
known-first-party = ["marigoldedge"]
